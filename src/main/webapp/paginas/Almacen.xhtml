<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="jakarta.faces.core"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
>
<f:view>
    <h:head></h:head>
    <h:body>
        <ui:composition template="../WEB-INF/plantillas/template-comun.xhtml">
            <ui:define name="titulo">#{almacenFrm.nombreBean}</ui:define>

            <ui:define name="contenido">
                <h1 class="tituloPagina">#{almacenFrm.nombreBean}</h1>

                <h:panelGroup id="pnlTabla">
                    <h:panelGrid>
                        <h:form id="frmTop" rendered="#{almacenFrm.estado=='NADA'}">
                            <p:dataTable id="tabla-top"
                                         lazy="true"
                                         rows="#{almacenFrm.pageSize}"
                                         paginator="true"
                                         paginatorPosition="bottom"
                                         value="#{almacenFrm.modelo}"
                                         var="r"
                                         selectionMode="single"
                                         selection="#{almacenFrm.registro}" rowKey="#{r.id}">
                                <p:ajax event="rowSelect" listener="#{almacenFrm.selectionHandler}" update=":pnlTabla :pnlDetalle"/>
                                <p:column>
                                    #{r.id}
                                    <f:facet name="header">ID</f:facet>
                                </p:column>
                                <p:column>
                                    #{r.activo?"Activo":"Inactivo"}
                                    <f:facet name="header">Estado</f:facet>
                                </p:column>
                                <p:column>
                                    #{almacenFrm.tipoAlmacenDAO.getTipoAlmacenPorAlmacen(r).nombre}
                                    <f:facet name="header">Tipo de Almacen</f:facet>
                                </p:column>
                                <p:column>
                                    #{r.observaciones}
                                    <f:facet name="header">Observaciones</f:facet>
                                </p:column>
                            </p:dataTable>

                            <p:commandButton
                                    id="btnNuevo"
                                    value="Nuevo Almacen"
                                    actionListener="#{almacenFrm.btnNuevoHandler}"
                                    update=":pnlDetalle :pnlTabla"
                            />

                            <p:messages id="msgs" redisplay="false" showDetail="true" showSummary="false" closable="true" />
                        </h:form>
                    </h:panelGrid>
                </h:panelGroup>

                <h:panelGroup id="pnlDetalle">
                    <h:form>
                        <p:commandButton
                                id="btnCancelar"
                                value="Cancelar"
                                actionListener="#{almacenFrm.btnCancelarHandler}"
                                styleClass="ui-button-warning"
                                rendered="#{almacenFrm.estado!='NADA'}"
                                update=":pnlDetalle :pnlTabla"
                                process="@this"
                        />
                    </h:form>

                    <h:form id="frmCrear" rendered="#{almacenFrm.estado!='NADA'}">
                        <p:messages id="msgs" autoUpdate="true" redisplay="false" showDetail="true" showSummary="false" closable="true" />

                        <h:panelGrid>
                            <p:outputLabel for="txtId" value="ID:"/>
                            <p:inputText id="txtId" value="#{almacenFrm.registro.id}" readonly="true"
                                         disabled="true"/>

                            <p:outputLabel for="chkActivo" value="Activo:"/>
                            <p:selectBooleanCheckbox id="chkActivo" value="#{almacenFrm.registro.activo}"/>

                            <p:outputLabel for="soTipoAlmacen" value="Tipo:"/>

                            <p:selectOneMenu id="soTipoAlmacen"
                                             value="#{almacenFrm.tipoAlmacenSeleccionado}"
                                             converter="tipoAlmacenConverter"
                                             required="true"
                                             requiredMessage="Debe seleccionar un tipo">
                                <f:selectItems value="#{almacenFrm.listaTiposAlmacen}"
                                               var="ta"
                                               itemLabel="#{ta.nombre}"
                                               itemValue="#{ta}" />
                            </p:selectOneMenu>

                            <p:outputLabel for="txtObservaciones" value="Observaciones:"/>
                            <p:inputTextarea id="txtObservaciones" value="#{almacenFrm.registro.observaciones}"
                                             size="80"/>

                            <p:commandButton
                                    id="btnGuardar"
                                    value="Guardar"
                                    actionListener="#{almacenFrm.btnGuardarHandler}"
                                    rendered="#{almacenFrm.estado=='CREAR'}"
                                    process="@form"
                                    update=":pnlDetalle :pnlTabla"
                                    styleClass="ui-button-success"
                            />

                            <p:commandButton
                                    id="btnModificar"
                                    value="Modificar"
                                    actionListener="#{almacenFrm.btnModificarHandler}"
                                    rendered="#{almacenFrm.estado=='MODIFICAR'}"
                                    styleClass="ui-button-secondary"
                                    process="@form"
                                    update=":pnlDetalle :pnlTabla "
                            />

                            <p:commandButton
                                    id="btnEliminar"
                                    value="Eliminar"
                                    actionListener="#{almacenFrm.btnEliminarHandler}"
                                    rendered="#{almacenFrm.estado=='MODIFICAR'}"
                                    styleClass="ui-button-danger"
                                    update=":frmTop :pnlDetalle :pnlTabla"
                            />
                        </h:panelGrid>
                    </h:form>
                </h:panelGroup>
            </ui:define>

        </ui:composition>

    </h:body>
</f:view>
</html>
