<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="jakarta.faces.core"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
>
<f:view>
    <h:head></h:head>
    <h:body>
        <ui:composition template="../WEB-INF/plantillas/template-comun.xhtml">
            <ui:define name="titulo">#{tipoAlmacenFrm.nombreBean}</ui:define>

            <ui:define name="contenido">
                <h1>#{tipoAlmacenFrm.nombreBean}</h1>

                <h:panelGroup id="pnlTabla" >
                    <h:panelGrid>
                        <h:form id="frmTop">
                            <p:dataTable id="tabla-top"
                                         lazy="true"
                                         rows="#{tipoAlmacenFrm.pageSize}"
                                         paginator="true"
                                         paginatorPosition="bottom"
                                         value="#{tipoAlmacenFrm.modelo}"
                                         var="r"
                                         selectionMode="single"
                                         selection="#{tipoAlmacenFrm.registro}" rowKey="#{r.id}">
                                <p:ajax event="rowSelect" listener="#{tipoAlmacenFrm.selectionHandler}" update=":pnlTabla :pnlDetalle"/>
                                <p:column>
                                    #{r.id}
                                    <f:facet name="header">ID</f:facet>
                                </p:column>
                                <p:column>
                                    #{r.nombre}
                                    <f:facet name="header">Nombre</f:facet>
                                </p:column>
                                <p:column>
                                    #{r.activo?'Activo':'Inactivo'}
                                    <f:facet name="header">Estado</f:facet>
                                </p:column>
                                <p:column>
                                    #{r.obsevaciones.toUpperCase()}
                                    <f:facet name="header">Observaciones</f:facet>
                                </p:column>
                            </p:dataTable>

                            <p:commandButton
                                    id="btnNuevo"
                                    value="Nuevo Tipo de Almacen"
                                    actionListener="#{tipoAlmacenFrm.btnNuevoHandler}"
                                    update=":pnlDetalle :pnlTabla"
                            />

                            <p:commandButton
                                    id="btnCancelar"
                                    value="Cancelar"
                                    actionListener="#{tipoAlmacenFrm.btnCancelarHandler}"
                                    styleClass="ui-button ui-button-danger"
                                    rendered="#{tipoAlmacenFrm.estado!='NADA'}"
                                    update=":pnlDetalle :pnlTabla"
                            />

                            <p:messages id="msgs" showDetail="true" redisplay="false" showSummary="false" closable="true" />
                        </h:form>
                    </h:panelGrid>
                </h:panelGroup>

                <h:panelGroup id="pnlDetalle">
                    <h:form id="frmCrear" rendered="#{tipoAlmacenFrm.estado!='NADA'}">
                        <h:panelGrid>
                            <p:outputLabel for="txtId" value="ID:" />
                            <p:inputText id="txtId" value="#{tipoAlmacenFrm.registro.id}" readonly="true" disabled="true"/>

                            <p:outputLabel for="txtNombre" value="Nombre:" />
                            <p:inputText id="txtNombre" value="#{tipoAlmacenFrm.registro.nombre}" size="75" />

                            <p:outputLabel for="chkActivo" value="Activo:" />
                            <p:selectBooleanCheckbox id="chkActivo" value="#{tipoAlmacenFrm.registro.activo}"/>

                            <p:outputLabel for="txtObservaciones" value="Observaciones:" />
                            <p:inputTextarea id="txtObservaciones" value="#{tipoAlmacenFrm.registro.obsevaciones}" size="80"/>

                            <p:commandButton
                                    id="btnGuardar"
                                    value="Guardar"
                                    actionListener="#{tipoAlmacenFrm.btnGuardarHandler}"
                                    rendered="#{tipoAlmacenFrm.estado=='CREAR'}"
                                    process="@form"
                                    update=":pnlDetalle :pnlTabla"
                                    styleClass="ui-button-success"
                            />

                            <p:commandButton
                                    id="btnModificar"
                                    value="Modificar"
                                    actionListener="#{tipoAlmacenFrm.btnModificarHandler}"
                                    rendered="#{tipoAlmacenFrm.estado=='MODIFICAR'}"
                                    styleClass="ui-button-secondary"
                                    process="@form"
                                    update=":pnlDetalle :pnlTabla "
                            />

                            <p:commandButton
                                    id="btnEliminar"
                                    value="Eliminar"
                                    actionListener="#{tipoAlmacenFrm.btnEliminarHandler}"
                                    rendered="#{tipoAlmacenFrm.estado=='MODIFICAR'}"
                                    styleClass="ui-button-danger"
                                    update=":frmTop :pnlDetalle :pnlTabla"
                            />
                        </h:panelGrid>
                    </h:form>
                </h:panelGroup>
            </ui:define>

        </ui:composition>

    </h:body>
</f:view>
</html>
