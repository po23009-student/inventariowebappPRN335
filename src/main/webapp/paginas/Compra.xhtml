<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="jakarta.faces.core"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
>
<f:view>
    <h:head></h:head>
    <h:body>
        <ui:composition template="../WEB-INF/plantillas/template-comun.xhtml">
            <ui:define name="titulo">#{compraFrm.nombreBean}</ui:define>

            <ui:define name="contenido">
                <h1 class="tituloPagina">#{compraFrm.nombreBean}</h1>

                <h:panelGroup id="pnlTabla" >
                    <h:panelGrid>
                        <h:form id="frmTop" rendered="#{compraFrm.estado=='NADA'}">
                            <p:dataTable id="tabla-top"
                                         lazy="true"
                                         rows="#{compraFrm.pageSize}"
                                         paginator="true"
                                         paginatorPosition="bottom"
                                         value="#{compraFrm.modelo}"
                                         var="r"
                                         selectionMode="single"
                                         selection="#{compraFrm.registro}" rowKey="#{r.id}">
                                <p:ajax event="rowSelect" listener="#{compraFrm.selectionHandler}" update=":pnlTabla :pnlDetalle"/>
                                <p:column>
                                    #{r.id}
                                    <f:facet name="header">ID</f:facet>
                                </p:column>
                                <p:column>
                                    #{r.idProveedor.nombre}
                                    <f:facet name="header">Proveedor</f:facet>
                                </p:column>
                                <p:column>
                                    #{r.fecha}
                                    <f:facet name="header">Fecha</f:facet>
                                </p:column>
                                <p:column>
                                    #{r.estado}
                                    <f:facet name="header">Estado</f:facet>
                                </p:column>
                                <p:column>
                                    #{r.observaciones}
                                    <f:facet name="header">Observaciones</f:facet>
                                </p:column>
                            </p:dataTable>

                            <p:commandButton id="btnNuevo" value="Nueva Compra" actionListener="#{compraFrm.btnNuevoHandler}" >
                                <f:ajax render=":pnlDetalle :pnlTabla"/>
                            </p:commandButton>

                            <p:messages id="msgs" redisplay="false" showDetail="true" showSummary="false" closable="true" />
                        </h:form>
                    </h:panelGrid>
                </h:panelGroup>

                <h:panelGroup id="pnlDetalle">
                    <h:form>
                        <p:commandButton
                                id="btnCancelar"
                                value="Cancelar"
                                actionListener="#{compraFrm.btnCancelarHandler}"
                                styleClass="ui-button-warning"
                                rendered="#{compraFrm.estado!='NADA'}"
                                update=":pnlDetalle :pnlTabla"
                        />
                    </h:form>

                    <p:tabView id="tabCompra" cache="false" dynamic="true" rendered="#{compraFrm.estado!='NADA'}">
                        <p:tab closable="false" title="Generalidades">
                            <h:form id="frmCrear">
                                <p:messages id="msgs" autoUpdate="true" redisplay="false" showDetail="true" showSummary="false" closable="true" />

                                <h:panelGrid>
                                    <p:outputLabel for="txtId" value="ID:" />
                                    <p:inputText id="txtId" value="#{compraFrm.registro.id}" readonly="true" disabled="true"/>

                                    <p:outputLabel for="txtProveedor" value="Proveedor:" />
                                    <p:inputText id="txtProveedor" readonly="true" disabled="true"/>

                                    <p:commandButton value="Seleccionar" type="button" icon="pi pi-external-link" onclick="PF('dlg1').show()"/>

                                    <p:dialog header="Seleccionar Proveedor" widgetVar="dlg1" minHeight="10" width="350" showEffect="fade" modal="true" closeOnEscape="true">
                                        <p:autoComplete
                                                id="acSimple"
                                                value="#{compraFrm.proveedorFrm.textoSeleccionado}"
                                                completeMethod="#{compraFrm.proveedorFrm.completeText}"
                                                scrollHeight="250"
                                                forceSelection="false"
                                        />
                                        <p:commandButton
                                                id="btnSeleccionarProv"
                                                value="Seleccionar"
                                                styleClass="ui-button"
                                                process="@this acSimple"
                                                update=":pnlDetalle :pnlTabla"
                                                oncomplete="PF('dlg1').hide()"
                                        />
                                    </p:dialog>

                                    <p:outputLabel for="menuEstado" value="Estado:" />
                                    <p:selectOneMenu id="menuEstado" value="#{compraFrm.registro.estado}">
                                        <f:selectItem itemLabel="ORDEN" itemValue="ORDEN" />
                                        <f:selectItem itemLabel="CREADA" itemValue="CREADA" />
                                        <f:selectItem itemLabel="APROBADA" itemValue="APROBADA" />
                                        <f:selectItem itemLabel="RECHAZADA" itemValue="RECHAZADA" />
                                        <f:selectItem itemLabel="ANULADA" itemValue="ANULADA" />
                                    </p:selectOneMenu>

                                    <p:outputLabel for="txtFecha" value="Fecha:" />
                                    <p:inputText id="txtFecha" value="#{compraFrm.registro.fecha}" size="75" />

                                    <p:outputLabel for="txtObservaciones" value="Observaciones:"/>
                                    <p:inputTextarea id="txtObservaciones" value="#{compraFrm.registro.observaciones}" size="80"/>

                                    <p:commandButton
                                            id="btnGuardar"
                                            value="Guardar"
                                            actionListener="#{compraFrm.btnGuardarHandler}"
                                            rendered="#{compraFrm.estado=='CREAR'}"
                                            styleClass="ui-button-success"
                                            update=":pnlDetalle :pnlTabla"
                                    />

                                    <p:commandButton
                                            id="btnModificar"
                                            value="Modificar"
                                            actionListener="#{compraFrm.btnModificarHandler}"
                                            rendered="#{compraFrm.estado=='MODIFICAR'}"
                                            styleClass="ui-button-secondary"
                                            update=":pnlDetalle :pnlTabla"
                                        />

                                    <p:commandButton
                                            id="btnEliminar"
                                            value="Eliminar"
                                            actionListener="#{compraFrm.btnEliminarHandler}"
                                            rendered="#{compraFrm.estado=='MODIFICAR'}"
                                            styleClass="ui-button-danger"
                                            update=":pnlDetalle :pnlTabla"
                                        />
                                </h:panelGrid>
                            </h:form>
                        </p:tab>

                        <p:tab closable="false" title="Detalles de Compra" disabled="#{compraFrm.estado!='MODIFICAR'}">

                            <h:panelGroup id="pnlCompraDetalle">
                                <h:panelGrid>
                                    <h:form id="frmTablaDetalleCompra">
                                        <p:dataTable
                                                id="tablaDetalles"
                                                value="#{compraFrm.cDetalleFrm.detalles}"
                                                var="d"
                                                lazy="true"
                                                rows="#{compraFrm.cDetalleFrm.pageSize}"
                                                paginator="true"
                                                paginatorPosition="bottom"
                                                selectionMode="single"
                                                selection="#{compraFrm.cDetalleFrm.registro}" rowKey="#{d.id}"
                                        >
                                            <p:column headerText="Producto">
                                                #{d.idProducto.nombreProducto}
                                            </p:column>
                                            <p:column headerText="Cantidad">
                                                #{d.cantidad}
                                            </p:column>
                                            <p:column headerText="Precio Unitario">
                                                #{d.precio}
                                            </p:column>
                                            <p:column headerText="Estado">
                                                #{d.estado}
                                            </p:column>
                                            <p:column headerText="Observaciones">
                                                #{d.observaciones}
                                            </p:column>
                                            <p:column headerText="Monto">
                                                #{d.precio * d.cantidad}
                                            </p:column>

                                        </p:dataTable>
                                    </h:form>
                                </h:panelGrid>
                            </h:panelGroup>
                        </p:tab>
                    </p:tabView>
                </h:panelGroup>
            </ui:define>

        </ui:composition>

    </h:body>
</f:view>
</html>
