<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="jakarta.faces.core"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
>
<f:view>
    <h:head></h:head>
    <h:body>
        <ui:composition template="../WEB-INF/plantillas/template-comun.xhtml">
            <ui:define name="titulo">#{compraFrm.nombreBean}</ui:define>

            <ui:define name="contenido">
                <h1 class="tituloPagina">#{compraFrm.nombreBean}</h1>

                <h:panelGroup id="pnlTabla" >
                    <h:panelGrid>
                        <h:form id="frmTop" rendered="#{compraFrm.estado=='NADA'}">
                            <p:dataTable id="tabla-top"
                                         lazy="true"
                                         rows="#{compraFrm.pageSize}"
                                         paginator="true"
                                         paginatorPosition="bottom"
                                         value="#{compraFrm.modelo}"
                                         var="r"
                                         selectionMode="single"
                                         selection="#{compraFrm.registro}" rowKey="#{r.id}">
                                <p:ajax event="rowSelect" listener="#{compraFrm.selectionHandler}" update=":pnlTabla :pnlDetalle"/>
                                <p:column>
                                    #{r.id}
                                    <f:facet name="header">ID</f:facet>
                                </p:column>
                                <p:column>
                                    #{r.proveedor.nombre}
                                    <f:facet name="header">Proveedor</f:facet>
                                </p:column>
                                <p:column>
                                    #{r.fecha}
                                    <f:facet name="header">Fecha</f:facet>
                                </p:column>
                                <p:column>
                                    #{r.estado}
                                    <f:facet name="header">Estado</f:facet>
                                </p:column>
                                <p:column>
                                    $ #{compraFrm.compraDetalleDAO.calcularMontoByCompra(r.id).setScale(2)}
                                    <f:facet name="header">Monto</f:facet>
                                </p:column>
                                <p:column>
                                    #{r.observaciones}
                                    <f:facet name="header">Observaciones</f:facet>
                                </p:column>
                            </p:dataTable>

                            <p:commandButton
                                    id="btnNuevo"
                                    value="Nueva Compra"
                                    actionListener="#{compraFrm.btnNuevoHandler}"
                                    update=":pnlDetalle :pnlTabla"
                            />

                            <p:messages id="msgs" redisplay="false" showDetail="true" showSummary="false" closable="true" />
                        </h:form>
                    </h:panelGrid>
                </h:panelGroup>

                <h:panelGroup id="pnlDetalle">
                    <h:form>
                        <p:commandButton
                                id="btnCancelar"
                                value="Cancelar"
                                actionListener="#{compraFrm.btnCancelarHandler}"
                                styleClass="ui-button-warning"
                                rendered="#{compraFrm.estado!='NADA'}"
                                update=":pnlDetalle :pnlTabla"
                        />
                    </h:form>

                    <p:tabView id="tabCompra" cache="false" dynamic="true" rendered="#{compraFrm.estado!='NADA'}">
                        <p:tab closable="false" title="Generalidades">
                            <h:form id="frmCrear">
                                <p:messages id="msgs" autoUpdate="true" redisplay="false" showDetail="true" showSummary="false" closable="true" />

                                <h:panelGrid>
                                    <p:outputLabel for="txtId" value="ID:" />
                                    <p:inputText id="txtId" value="#{compraFrm.registro.id}" readonly="true" disabled="true"/>

                                    <p:outputLabel for="txtProveedor" value="Proveedor:" />
                                    <p:inputText id="txtProveedor" value="#{compraFrm.proveedorSeleccionado.nombre}" readonly="true"/>

                                    <p:commandButton value="Seleccionar" type="button" icon="pi pi-external-link" onclick="PF('dlg1').show()"/>

                                    <p:dialog header="Seleccionar Proveedor" widgetVar="dlg1" minHeight="10" width="350" showEffect="fade" modal="true" closeOnEscape="true">
                                        <p:autoComplete
                                                id="acSimple"
                                                value="#{compraFrm.proveedorSeleccionado}"
                                                completeMethod="#{proveedorFrm.completeText}"
                                                var="prov"
                                                itemLabel="#{prov.nombre}"
                                                itemValue="#{prov}"
                                                converter="proveedorConverter"
                                                forceSelection="true"
                                                scrollHeight="250"
                                        />

                                        <p:commandButton
                                                id="btnSeleccionarProv"
                                                value="Seleccionar"
                                                process="@this acSimple"
                                                update="txtProveedor"
                                                actionListener="#{compraFrm.btnSeleccionarProv}"
                                                oncomplete="PF('dlg1').hide()"
                                        />

                                    </p:dialog>

                                    <p:outputLabel for="menuEstado" value="Estado:" />
                                    <p:selectOneMenu id="menuEstado" value="#{compraFrm.registro.estado}">
                                        <f:selectItem itemLabel="ORDEN" itemValue="ORDEN" />
                                        <f:selectItem itemLabel="CREADA" itemValue="CREADA" />
                                        <f:selectItem itemLabel="APROBADA" itemValue="APROBADA" />
                                        <f:selectItem itemLabel="RECHAZADA" itemValue="RECHAZADA" />
                                        <f:selectItem itemLabel="ANULADA" itemValue="ANULADA" />
                                    </p:selectOneMenu>

                                    <p:outputLabel for="dpFecha" value="Fecha"/>
                                    <p:datePicker id="dpFecha"
                                                  value="#{compraFrm.registro.fecha}"
                                                  showTime="true"
                                                  hourFormat="24"
                                                  timeInput="true"
                                                  timeZone="America/El_Salvador"
                                                  pattern="yyyy-MM-dd'T'HH:mm"
                                                  converter="offsetDateTimeConverter"
                                                  requiredMessage="La fecha es obligatoria"
                                                  touchUI="false" />

                                    <p:outputLabel for="txtObservaciones" value="Observaciones:"/>
                                    <p:inputTextarea id="txtObservaciones" value="#{compraFrm.registro.observaciones}" size="80"/>

                                    <p:commandButton
                                            id="btnGuardar"
                                            value="Guardar"
                                            actionListener="#{compraFrm.btnGuardarHandler}"
                                            rendered="#{compraFrm.estado=='CREAR'}"
                                            styleClass="ui-button-success"
                                            update=":pnlDetalle :pnlTabla"
                                    />

                                    <p:commandButton
                                            id="btnModificar"
                                            value="Modificar"
                                            actionListener="#{compraFrm.btnModificarHandler}"
                                            rendered="#{compraFrm.estado=='MODIFICAR'}"
                                            styleClass="ui-button-secondary"
                                            update=":pnlDetalle :pnlTabla"
                                    />

                                    <p:commandButton
                                            id="btnEliminar"
                                            value="Eliminar"
                                            actionListener="#{compraFrm.btnEliminarHandler}"
                                            rendered="#{compraFrm.estado=='MODIFICAR'}"
                                            styleClass="ui-button-danger"
                                            update=":pnlDetalle :pnlTabla"
                                    />
                                </h:panelGrid>
                            </h:form>
                        </p:tab>

                        <p:tab id="pnlDetalleCompra" closable="false" title="Detalles de Compra" disabled="#{compraFrm.estado!='MODIFICAR'}">
                            <ui:include src="CompraDetalle.xhtml" />
                        </p:tab>
                    </p:tabView>
                </h:panelGroup>
            </ui:define>

            <script>
                var ws = new WebSocket("ws://localhost:9080/inventariowebappPRN335-1.0-SNAPSHOT/kardex");
                ws.onmessage = function(event) {
                    let mensaje = event.data;
                    console.log(mensaje);
                    actualizar();
                    //location.reload();
                }

                ws.onopen()=(e) => {
                    console.log("Conexión establecida con el servidor de WebSocket.");
                };
            </script>

        </ui:composition>

    </h:body>
</f:view>
</html>
