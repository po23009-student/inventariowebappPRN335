<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="jakarta.faces.core"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
>
<f:view>
    <h:head></h:head>
    <h:body>
        <ui:composition template="../WEB-INF/plantillas/template-comun.xhtml">
            <ui:define name="titulo">#{clienteFrm.nombreBean}</ui:define>

            <ui:define name="contenido">
                <h1 class="tituloPagina">#{clienteFrm.nombreBean}</h1>

                <h:panelGroup id="pnlTabla">
                    <h:panelGrid>
                        <h:form id="frmTop" rendered="#{clienteFrm.estado=='NADA'}">
                            <p:dataTable id="tabla-top"
                                         lazy="true"
                                         rows="#{clienteFrm.pageSize}"
                                         paginator="true"
                                         paginatorPosition="bottom"
                                         value="#{clienteFrm.modelo}"
                                         var="r"
                                         selectionMode="single"
                                         selection="#{clienteFrm.registro}" rowKey="#{r.id}">
                                <p:ajax event="rowSelect" listener="#{clienteFrm.selectionHandler}" update=":pnlTabla :pnlDetalle"/>
                                <p:column>
                                    #{r.id}
                                    <f:facet name="header">ID</f:facet>
                                </p:column>
                                <p:column>
                                    #{r.nombre}
                                    <f:facet name="header">Nombre</f:facet>
                                </p:column>
                                <p:column>
                                    #{r.dui}
                                    <f:facet name="header">DUI</f:facet>
                                </p:column>
                                <p:column>
                                    #{r.nit}
                                    <f:facet name="header">NIT</f:facet>
                                </p:column>
                                <p:column>
                                    #{r.activo?"Activo":"Inactivo"}
                                    <f:facet name="header">Estado</f:facet>
                                </p:column>
                            </p:dataTable>

                            <p:commandButton
                                    id="btnNuevo"
                                    value="Nuevo Cliente"
                                    actionListener="#{clienteFrm.btnNuevoHandler}"
                                    update=":pnlDetalle :pnlTabla"
                            />

                            <p:messages id="msgs" redisplay="false" showDetail="true" showSummary="false" closable="true" />
                        </h:form>

                    </h:panelGrid>
                </h:panelGroup>

                <h:panelGroup id="pnlDetalle">
                    <h:form>
                        <p:commandButton
                                id="btnCancelar"
                                value="Cancelar"
                                actionListener="#{clienteFrm.btnCancelarHandler}"
                                styleClass="ui-button-warning"
                                rendered="#{clienteFrm.estado!='NADA'}"
                                update=":pnlDetalle :pnlTabla"
                        />
                    </h:form>

                    <h:form id="frmCrear" rendered="#{clienteFrm.estado!='NADA'}">
                        <p:messages id="msgs" autoUpdate="true" redisplay="false" showDetail="true" showSummary="false" closable="true" />

                        <h:panelGrid>
                            <p:outputLabel for="txtId" value="ID:"/>
                            <p:inputText id="txtId" value="#{clienteFrm.registro.id}" readonly="true"
                                         disabled="true"/>

                            <p:outputLabel for="txtNombre" value="Nombre:"/>
                            <p:inputText id="txtNombre" value="#{clienteFrm.registro.nombre}" size="75"
                                         required="true"/>

                            <p:outputLabel for="txtDui" value="DUI:"/>
                            <p:inputText id="txtDui" value="#{clienteFrm.registro.dui}" size="75" required="true" />

                            <p:outputLabel for="txtNit" value="NIT:"/>
                            <p:inputText id="txtNit" value="#{clienteFrm.registro.nit}" size="75" />

                            <p:outputLabel for="chkActivo" value="Activo:"/>
                            <p:selectBooleanCheckbox id="chkActivo" value="#{clienteFrm.registro.activo}"/>

                            <p:commandButton
                                    id="btnGuardar"
                                    value="Guardar"
                                    actionListener="#{clienteFrm.btnGuardarHandler}"
                                    rendered="#{clienteFrm.estado=='CREAR'}"
                                    process="@form"
                                    update=":pnlDetalle :pnlTabla"
                                    styleClass="ui-button-success"
                            />

                            <p:commandButton
                                    id="btnModificar"
                                    value="Modificar"
                                    actionListener="#{clienteFrm.btnModificarHandler}"
                                    rendered="#{clienteFrm.estado=='MODIFICAR'}"
                                    styleClass="ui-button-secondary"
                                    process="@form"
                                    update=":pnlDetalle :pnlTabla "
                            />

                            <p:commandButton
                                    id="btnEliminar"
                                    value="Eliminar"
                                    actionListener="#{clienteFrm.btnEliminarHandler}"
                                    rendered="#{clienteFrm.estado=='MODIFICAR'}"
                                    styleClass="ui-button-danger"
                                    update=":frmTop :pnlDetalle :pnlTabla"
                            />
                        </h:panelGrid>
                    </h:form>
                </h:panelGroup>
            </ui:define>

        </ui:composition>

    </h:body>
</f:view>
</html>
